services:
  db:
    image: postgres:16-alpine
    container_name: mileage-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mileage
      POSTGRES_PASSWORD: mileage
      POSTGRES_DB: mileage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mileage -d mileage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
